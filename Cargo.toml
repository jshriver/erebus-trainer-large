[package]
name = "erebus-trainer-large"
version = "1.0.0"
edition = "2024"
rust-version = "1.87"

[[bin]]
name = "erebus-trainer-large"
path = "src/main.rs"

[dependencies]
bullet_lib     = { git = "https://github.com/jw1912/bullet", branch = "main" }
bullet-trainer = { git = "https://github.com/jw1912/bullet", branch = "main" }

[features]
# CUDA on by default -- this trainer only ever runs on NVIDIA hardware.
# On a machine without the CUDA toolkit, use `cargo check --no-default-features`
# for a syntax-only check.
default = ["cuda"]
cuda  = ["bullet_lib/cuda", "bullet-trainer/cuda"]
rocm  = ["bullet_lib/rocm", "bullet-trainer/rocm"]

[profile.release]
opt-level = 3
lto = "thin"
